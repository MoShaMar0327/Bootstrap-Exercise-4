<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark px-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">Lumber Jack's</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="products.html">Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  
  <section class="bg-primary text-white text-center py-5">
    <div class="container animate__animated animate__fadeInDown">
      <h1 class="display-4 fw-bold">Welcome to Lumber Jack's</h1>
      <p class="lead mx-auto mt-3" style="max-width: 650px;">
        Your #1 shop for outdoor equipment and essentials built for camping.
      </p>
      <a href="products.html" class="btn btn-light btn-lg mt-3 fw-semibold">Explore Our Catalog</a>
    </div>
  </section>

  <div class="container my-4" style="max-width: 900px;">
    <div id="demo" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
      </div>

      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://images.pexels.com/photos/14036357/pexels-photo-14036357.jpeg?auto=compress&w=1260&h=750&dpr=1" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Camp 1">
        </div>
        <div class="carousel-item">
          <img src="https://img.magnific.com/premium-photo/peaceful-camping-scene-by-lake-with-tent-set-up-campfire-burning-people-relaxing_1271419-6960.jpg?semt=ais_hybrid&w=740&q=80" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Camp 2">
        </div>
        <div class="carousel-item">
          <img src="https://img.magnific.com/free-photo/couple-tourists-enjoying-camping-mountains_335224-1332.jpg?semt=ais_hybrid&w=740&q=80" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Camp 3">
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0">© 2026 Lumber Jack's. All rights reserved.</p>
    </div>
  </footer>

</html>
